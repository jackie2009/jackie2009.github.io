<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>伊苏 x 黄金矿工 (钩爪强化版)</title>
    <style>
        body { background-color: #222; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: Arial, sans-serif; }
        #gameCanvas { background-color: #000; border: 4px solid #fff; image-rendering: pixelated; }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="600" height="800"></canvas>

<script>
const CANVAS_WIDTH = 600;
const CANVAS_HEIGHT = 800;
const SPLIT_Y = 300; 

// 像素画家对象
const Painter = {
    drawHero(ctx, x, y, frame) {
        ctx.save();
        ctx.translate(x, y);
        const offset = Math.sin(frame * 0.1) * 3;
        ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(0, 5, 20, 8, 0, 0, Math.PI * 2); ctx.fill(); // 阴影
        ctx.fillStyle = "#c0392b"; ctx.fillRect(-18, -35 + offset, 12, 25); // 披风
        ctx.fillStyle = "#2980b9"; ctx.fillRect(-12, -40 + offset, 24, 35); // 身体
        ctx.fillStyle = "#ffe0bd"; ctx.fillRect(-10, -55 + offset, 20, 20); // 头部
        ctx.fillStyle = "#34495e"; ctx.fillRect(-10, -58 + offset, 20, 8);  // 头发
        ctx.fillStyle = "#bdc3c7"; ctx.fillRect(8, -45 + offset, 6, 30);   // 剑
        ctx.restore();
    },
    drawBoar(ctx, x, y, frame) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(-1, 1);
        const bounce = Math.abs(Math.sin(frame * 0.15)) * 4;
        ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(0, 5, 25, 10, 0, 0, Math.PI * 2); ctx.fill(); // 阴影
        ctx.fillStyle = "#4a2c2a"; ctx.fillRect(-25, -35 + bounce, 50, 30); // 身体
        ctx.fillStyle = "#5d3a37"; ctx.fillRect(15, -30 + bounce, 20, 20);  // 头部
        ctx.fillStyle = "#ecf0f1"; ctx.fillRect(30, -15 + bounce, 8, 5);    // 獠牙
        ctx.fillStyle = "#ff0000"; ctx.fillRect(25, -25 + bounce, 4, 4);    // 眼睛
        ctx.restore();
    },
    drawBG(ctx) {
        ctx.fillStyle = "#2c1e2f";
        ctx.beginPath();
        ctx.moveTo(0, SPLIT_Y); ctx.lineTo(150, 150); ctx.lineTo(300, SPLIT_Y);
        ctx.moveTo(250, SPLIT_Y); ctx.lineTo(450, 180); ctx.lineTo(600, SPLIT_Y);
        ctx.fill();
    },
    // 🎨 新增：专门绘制钩头箭头的方法
    drawHookHead(ctx, x, y, angle) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.fillStyle = "#f1c40f"; // 金色钩头
        ctx.beginPath();
        ctx.moveTo(15, 0);      // 尖端
        ctx.lineTo(-8, -12);    // 上侧倒钩
        ctx.lineTo(0, 0);       // 回缩点
        ctx.lineTo(-8, 12);     // 下侧倒钩
        ctx.closePath();
        ctx.fill();
        // 给箭头加个白边，更清晰
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();
    }
};

const ITEM_TYPES = [
    { label: "攻", name: "普通攻击", color: "#ecf0f1", radius: 16, damage: 15, weight: 1.0, minD: 80, maxD: 250 },
    { label: "重", name: "重击", color: "#2ecc71", radius: 18, damage: 35, weight: 1.2, minD: 180, maxD: 350 },
    { label: "雷", name: "雷电斩!!", color: "#f1c40f", radius: 20, damage: 85, weight: 1.5, minD: 350, maxD: 480, effect: 'thunder' },
    { label: "火", name: "烈火斩!!", color: "#e67e22", radius: 22, damage: 65, weight: 1.3, minD: 280, maxD: 420, effect: 'fire' },
    { label: "药", name: "回复药水", color: "#ff4757", radius: 16, value: 40, weight: 1.0, minD: 100, maxD: 300 },
    { label: "时", name: "时间沙漏", color: "#1e90ff", radius: 18, value: 5, weight: 1.0, minD: 150, maxD: 400 }
];

class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.frame = 0;
        this.shake = 0;
        this.state = 'PLAYER_TURN';
        this.turnTimer = 12.0;
        this.hero = { x: 120, y: 240, hp: 100, maxHp: 150 };
        this.enemy = { x: 480, y: 240, hp: 600, maxHp: 600 };
        this.hook = { x: 300, y: SPLIT_Y + 10, angle: Math.PI/2, angleSpeed: 0.045, angleDir: 1, length: 25, status: 'SWING', speed: 15, caughtItem: null };
        this.items = [];
        this.floatingTexts = [];
        this.effects = [];
        
        this.initItems();
        this.bindInput();
        this.loop();
    }

    initItems() {
        this.items = [];
        for (let i = 0; i < 12; i++) {
            const template = ITEM_TYPES[Math.floor(Math.random() * ITEM_TYPES.length)];
            const angleRad = (25 + Math.random() * 130) * (Math.PI / 180);
            const dist = template.minD + Math.random() * (template.maxD - template.minD);
            const x = this.hook.x + Math.cos(angleRad) * dist;
            const y = this.hook.y + Math.sin(angleRad) * dist;
            if (x < 40 || x > 560 || y > 760) { i--; continue; }
            this.items.push({ ...template, x, y, active: true });
        }
    }

    bindInput() {
        const fire = () => {
            if (this.state === 'PLAYER_TURN' && this.hook.status === 'SWING' && this.turnTimer > 0) this.hook.status = 'SHOOT';
            if (this.state === 'GAME_OVER') location.reload();
        };
        window.addEventListener('keydown', (e) => { if(e.code === 'Space') fire(); });
        this.canvas.addEventListener('mousedown', fire);
    }

    applyEffect(item) {
        this.shake = 10;
        this.addFloatingText(item.name, 300, 100, item.color, 32);
        if (item.damage) {
            this.enemy.hp -= item.damage;
            this.effects.push({ x: this.enemy.x, y: this.enemy.y, type: item.effect || 'hit', life: 1.0 });
            this.addFloatingText("-" + item.damage, this.enemy.x, this.enemy.y - 50, "#fff", 24);
        } else if (item.label === "药") {
            this.hero.hp = Math.min(this.hero.hp + item.value, 150);
            this.effects.push({ x: this.hero.x, y: this.hero.y, type: 'heal', life: 1.0 });
            this.addFloatingText("+" + item.value, this.hero.x, this.hero.y - 50, "#2ecc71", 24);
        } else if (item.label === "时") {
            this.turnTimer = Math.min(this.turnTimer + item.value, 20);
        }
        if (this.enemy.hp <= 0) this.state = 'GAME_OVER';
    }

    update() {
        this.frame++;
        if (this.shake > 0) this.shake *= 0.9;
        this.floatingTexts.forEach(t => { t.y -= 1; t.life -= 0.02; });
        this.floatingTexts = this.floatingTexts.filter(t => t.life > 0);
        this.effects.forEach(e => e.life -= 0.05);
        this.effects = this.effects.filter(e => e.life > 0);

        if (this.state === 'PLAYER_TURN') {
            this.turnTimer -= 0.016;
            const h = this.hook;
            if (h.status === 'SWING') {
                h.angle += h.angleSpeed * h.angleDir;
                if (h.angle > Math.PI - 0.2 || h.angle < 0.2) h.angleDir *= -1;
            } else if (h.status === 'SHOOT') {
                h.length += h.speed;
                const tx = h.x + Math.cos(h.angle) * h.length, ty = h.y + Math.sin(h.angle) * h.length;
                if (tx < 0 || tx > 600 || ty > 800) h.status = 'PULL';
                for (let it of this.items) {
                    if (it.active && Math.hypot(tx-it.x, ty-it.y) < it.radius + 10) {
                        h.caughtItem = it; it.active = false; h.status = 'PULL'; break;
                    }
                }
            } else if (h.status === 'PULL') {
                // 回收速度受重量稍微影响，增加手感
                const currentSpeed = h.speed / (h.caughtItem ? h.caughtItem.weight : 1);
                h.length -= currentSpeed;
                if (h.length <= 25) {
                    h.length = 25; h.status = 'SWING';
                    if (h.caughtItem) { this.applyEffect(h.caughtItem); h.caughtItem = null; }
                    if (this.items.filter(i=>i.active).length < 3) this.initItems();
                }
            }
            if (this.turnTimer <= 0 && h.status === 'SWING') { this.state = 'ENEMY_TURN'; this.enemyWait = 60; }
        } else if (this.state === 'ENEMY_TURN') {
            if (this.enemyWait-- <= 0) {
                this.hero.hp -= 25; this.shake = 15;
                this.effects.push({ x: this.hero.x, y: this.hero.y, type: 'hit', life: 1.0 });
                this.state = 'PLAYER_TURN'; this.turnTimer = 12.0;
                if (this.hero.hp <= 0) this.state = 'GAME_OVER';
            }
        }
    }

    draw() {
        const ctx = this.ctx;
        ctx.save();
        if (this.shake > 1) ctx.translate(Math.random()*this.shake, Math.random()*this.shake);
        
        // 背景
        ctx.fillStyle = "#3a2c3c"; ctx.fillRect(0,0,600,300);
        Painter.drawBG(ctx);
        Painter.drawHero(ctx, this.hero.x, this.hero.y, this.frame);
        Painter.drawBoar(ctx, this.enemy.x, this.enemy.y, this.frame);

        // 下半场矿区
        ctx.fillStyle = "#1a1a2e"; ctx.fillRect(0,300,600,500);
        this.items.forEach(it => {
            if (!it.active) return;
            ctx.fillStyle = it.color; ctx.beginPath(); ctx.arc(it.x, it.y, it.radius, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = it.color === "#ecf0f1" ? "#000" : "#fff";
            ctx.font = "bold 16px Arial"; ctx.textAlign="center"; ctx.textBaseline="middle";
            ctx.fillText(it.label, it.x, it.y);
        });

        // 🏹 核心修改：绘制线 + 旋转钩头
        const endX = this.hook.x + Math.cos(this.hook.angle) * this.hook.length;
        const endY = this.hook.y + Math.sin(this.hook.angle) * this.hook.length;
        
        // 画线
        ctx.strokeStyle = "#fff"; 
        ctx.lineWidth = 2; 
        ctx.beginPath(); 
        ctx.moveTo(this.hook.x, this.hook.y); 
        ctx.lineTo(endX, endY); 
        ctx.stroke();

        // 画旋转钩头
        Painter.drawHookHead(ctx, endX, endY, this.hook.angle);

        // 如果抓到了东西，显示在钩头处
        if (this.hook.caughtItem) {
            ctx.fillStyle = this.hook.caughtItem.color; 
            ctx.beginPath(); ctx.arc(endX, endY, 12, 0, Math.PI*2); ctx.fill();
        }

        // UI & 文字
        ctx.fillStyle = "#f00"; ctx.fillRect(430, 20, 150 * (this.enemy.hp/600), 10);
        ctx.fillStyle = "#0f0"; ctx.fillRect(20, 20, 150 * (this.hero.hp/150), 10);
        if (this.state === 'PLAYER_TURN') {
            ctx.fillStyle = "#3498db"; ctx.fillRect(200, 280, 200 * (this.turnTimer/20), 8);
        }

        this.floatingTexts.forEach(t => {
            ctx.fillStyle = t.color; ctx.font = `bold ${t.size}px Arial`; ctx.textAlign="center";
            ctx.fillText(t.text, t.x, t.y);
        });
        
        this.effects.forEach(e => {
            ctx.fillStyle = e.type === 'fire' ? "orange" : e.type === 'thunder' ? "yellow" : "white";
            ctx.globalAlpha = e.life; ctx.beginPath(); ctx.arc(e.x, e.y, 50*(1-e.life), 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
        });

        if (this.state === 'GAME_OVER') {
            ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(0,0,600,800);
            ctx.fillStyle = "#fff"; ctx.font = "40px Arial"; ctx.textAlign="center";
            ctx.fillText(this.hero.hp > 0 ? "VICTORY" : "GAME OVER", 300, 400);
        }

        ctx.restore();
    }

    addFloatingText(text, x, y, color, size) {
        this.floatingTexts.push({ text, x, y, color, size, life: 1.0 });
    }

    loop() {
        this.update();
        this.draw();
        requestAnimationFrame(() => this.loop());
    }
}

window.onload = () => new Game();
</script>
</body>
</html>
